# Temporary, for the syntax-1 build only: compiles main and this branch and
# prints both builds into the log, so their outputs can be compared in a
# session without Gleam (the session's proxy blocks artifact downloads, but
# not logs). Removed before review.
name: syntax-1 builds (temporary)

on:
  push:
    branches: [syntax-1]

permissions:
  contents: read

concurrency:
  group: syntax-1-builds
  cancel-in-progress: true

env:
  GLEAM_VERSION: "1.19.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/checkout@v4
        with:
          ref: a2b213dafd96e996aabcfc2745418689bc2fb362
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Gleam
        run: |
          base=https://github.com/gleam-lang/gleam/releases/download/v$GLEAM_VERSION
          mkdir -p "$HOME/.gleam/bin"
          curl -fsSL "$base/gleam-v$GLEAM_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$HOME/.gleam/bin"
          echo "$HOME/.gleam/bin" >> "$GITHUB_PATH"
      - name: Build main
        run: cd before && gleam build --target javascript
      - name: Build this branch
        run: cd after && { gleam build --target javascript 2>&1; echo "BUILD-EXIT $?"; }
      - name: Test this branch
        run: cd after && { gleam test 2>&1 | tail -80; echo "TEST-EXIT ${PIPESTATUS[0]}"; }
        shell: bash
      - name: Bootstrap this branch
        run: cd after && { node bin/sheaf.mjs bootstrap 2>&1 | tail -20; echo "BOOT-EXIT ${PIPESTATUS[0]}"; }
        shell: bash
      - name: Print the builds
        run: |
          for side in before after; do
            if [ -d $side/build/dev/javascript ]; then
              tar czf $side.tgz --exclude=_gleam_artefacts -C $side/build/dev javascript
              echo "=====BEGIN-$side $(sha256sum $side.tgz | cut -c1-64)"
              base64 -w 100 $side.tgz
              echo "=====END-$side"
            fi
          done
