<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheaf Playground</title>
<meta name="description" content="Edit Sheaf's Gleam source and rebuild its workspace in your browser with the Gleam compiler compiled to WebAssembly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Layout: a tool bar over two columns: the Gleam source with its compiler output on the
   left, the workspace that source builds on the right. Stacks on narrow screens. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
#bar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 54px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  background: var(--bar); border-bottom: 1px solid var(--stroke); }
#bar .name { font: 600 16px var(--font-ui); color: var(--ink); text-decoration: none; margin-right: 4px; }
#bar .name span { color: var(--muted); font-weight: 400; }
#bar select, #bar button { font: 13px var(--font-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--stroke);
  border-radius: 7px; padding: 6px 10px; cursor: pointer; }
#bar select { max-width: min(320px, 60vw); }
#bar button:hover, #bar select:hover { border-color: var(--accent); }
#bar button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
#bar button:disabled { opacity: .6; cursor: progress; }
#bar .grow { flex: 1; }
#status { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status.ok { color: var(--good); } #status.bad { color: var(--bad); }
#bar a.link { font-size: 13px; color: var(--muted); text-decoration: none; }
#bar a.link:hover { color: var(--ink); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); }
#left { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--stroke); }
#try { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--stroke); background: var(--panel); font-size: 12.5px; color: var(--muted); }
#try button { font: 12.5px var(--font-ui); padding: 4px 9px; border-radius: 99px; border: 1px solid var(--stroke); background: var(--bg); color: var(--ink); cursor: pointer; }
#try button:hover { border-color: var(--accent); }
#editor { flex: 1; min-height: 0; display: flex; background: var(--panel); position: relative; }
#gutter { flex: none; width: 56px; overflow: hidden; padding: 10px 8px 10px 0; text-align: right; color: var(--muted); opacity: .7;
  font: 12.5px/19px var(--font-code); user-select: none; background: var(--head); border-right: 1px solid var(--stroke); white-space: pre; }
#gutter .err { color: var(--bad); font-weight: 600; opacity: 1; }
#code { flex: 1; min-width: 0; border: 0; resize: none; margin: 0; padding: 10px 12px; background: transparent; color: var(--ink);
  font: 12.5px/19px var(--font-code); tab-size: 2; white-space: pre; overflow: auto; outline: none; }
#code[readonly] { color: var(--muted); }
#ro { position: absolute; right: 14px; top: 8px; font-size: 11.5px; color: var(--muted); background: var(--head); border: 1px solid var(--stroke); border-radius: 6px; padding: 2px 8px; }
#out { flex: none; max-height: 34%; overflow: auto; border-top: 1px solid var(--stroke); background: var(--bar); font: 12px/1.5 var(--font-code); }
#out:empty { display: none; }
#out .msg { padding: 8px 12px; border-bottom: 1px solid var(--stroke); white-space: pre-wrap; word-break: break-word; }
#out .msg.error { color: var(--bad); }
#out .msg.warning { color: var(--warn); }
#out .loc { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
#right { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
#ws { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
#cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); background: var(--bg); }
#cover .box { max-width: 420px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
#cover b { color: var(--ink); font-size: 16px; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--stroke); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
#built { position: absolute; right: 12px; bottom: 12px; font-size: 12px; background: var(--panel); border: 1px solid var(--stroke); border-radius: 7px; padding: 4px 9px; color: var(--muted); pointer-events: none; }
@media (max-width: 900px) {
  body { overflow: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh 80vh; }
  #left { border-right: 0; border-bottom: 1px solid var(--stroke); }
  .wide { display: none; }
}
</style>
</head>
<body>
<div id="bar">
  <a class="name" href="./">Sheaf <span>Playground</span></a>
  <label for="file" style="position:absolute;left:-9999px">Source file</label>
  <select id="file"></select>
  <button id="compile" class="primary" title="Compile Sheaf with the Gleam compiler running in this page (Ctrl+Enter)">Compile &amp; run</button>
  <button id="reset" title="Put this file back as it was">Reset file</button>
  <button id="resetall" class="wide" title="Undo every change">Reset all</button>
  <span id="status" role="status" aria-live="polite">Loading…</span>
  <span class="grow"></span>
  <a class="link wide" href="workspace.html">Prebuilt workspace</a>
</div>
<main>
  <section id="left" aria-label="Source">
    <div id="try"><span>Try:</span>
      <button data-try="slow">Slow the canvas glide</button>
      <button data-try="label">Relabel “compiled”</button>
      <button data-try="title">Rename the tool bar</button>
      <button data-try="break">Break the types</button>
    </div>
    <div id="editor">
      <div id="gutter" aria-hidden="true"></div>
      <label for="code" style="position:absolute;left:-9999px">Gleam source</label>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
      <span id="ro" hidden>standard library · read-only</span>
    </div>
    <div id="out" aria-live="polite"></div>
  </section>
  <section id="right" aria-label="Workspace built from this source">
    <iframe id="ws" title="Sheaf workspace built in this page"></iframe>
    <div id="cover"><div class="box"><div class="spin"></div><b>Loading the Gleam compiler</b><span>About 5 MB of WebAssembly, then Sheaf and the standard library compile here, in your browser.</span></div></div>
    <div id="built" hidden></div>
  </section>
</main>
<script type="module" src="playground.js"></script>
</body>
</html>
